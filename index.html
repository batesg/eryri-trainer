 if(tired&&rem.length)reasons.push('Tired-legs mode is on: remaining runs are 15% shorter and hill reps are reduced.');
 // 4. gym
 rem.forEach(r=>{
  r.adjKm=r.km*fK*(tired?.85:1);r.adjCl=r.cl*fC*(tired?.85:1);
  const g=gym.filter(x=>x.date===addDays(r.d,-1)&&(x.rpe>=7||(x.type==='Legs'&&x.mins>=40)||(CARDIO.includes(x.type)&&x.mins>=75)));
  if(g.length){r.adjKm*=.85;r.adjCl*=.85;r.gymHit=true;reasons.push(`Heavy gym session the day before ${r.day} (${g[0].type}, effort ${g[0].rpe}/10): ${r.day} is 15% lighter.`)}
  if(r.reps){let n=Math.round(r.reps*Math.min(fC,1)*(tired?.85:1));if(r.gymHit)n-=2;r.reps=Math.max(4,Math.min(r.reps+1,n))}
 });
 rem.forEach(r=>{r.adjKm=Math.max(2,r05(r.adjKm));r.adjCl=r5(r.adjCl);r.changed=Math.abs(r.adjKm-r.km)>=.5||Math.abs(r.adjCl-r.cl)>=10;
  if(r.reps){const o=+/\((\d+) repeats\)/.exec(r.t)[1];r.repsChanged=r.reps!==o;r.changed=r.changed||r.repsChanged}});
 out.adjKm=tot.km+rows.filter(r=>!r.run&&r.d>=t).reduce((s,r)=>s+r.adjKm,0)+0;
 out.adjCl=tot.cl+rows.filter(r=>!r.run&&r.d>=t).reduce((s,r)=>s+r.adjCl,0);
 out.tired=tired;out.rem=rem;
 // next week outlook
 if(w<25){const nx=PLAN.weeks[w];const doneRef=Math.max(tot.cl,out.adjCl);const cap=r5(Math.max(doneRef,refCl)*1.15);
  out.next={w:w+1,focus:nx.focus,cl:nx.cl,km:nx.km,capCl:cap,trim:nx.cl>cap}}
 return out}

function chart(o){
 const W=360,H=132,pl=32,pr=6,pt=8,pb=20;
 const ms=weeksList(),all=ms,sl=chartRange?all.slice(-chartRange):all,n=sl.length,step=(W-pl-pr)/n;
 const vals=sl.map(m=>o.val(totals(m))),plans=o.plan?sl.map(m=>o.plan(planFor(m))):[];
 const cand=vals.concat(plans).filter(v=>v!=null&&isFinite(v));
 let mx=Math.max(...cand,o.min||1)*1.12,mn=0;
 if(o.line){const lo=Math.min(...cand),hi=Math.max(...cand);const pad=(hi-lo)*.2||1;mn=Math.max(0,lo-pad);mx=hi+pad}
 const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)} by week">`;
 for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${o.axis(v)}</text>`}
 const every=Math.ceil(n/6);
 sl.forEach((m,i)=>{const x=pl+i*step,cx=x+step/2,v=vals[i];
  if(m===selWeek)s+=`<rect class="sel" x="${x}" y="${pt}" width="${step}" height="${H-pt-pb}"/>`;
  if(i%every===0||i===n-1)s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${esc(shortD(m))}</text>`;
  if(!o.line&&v>0){const bw=Math.max(3,step*.62);s+=`<rect class="bar${m===mondayOf(today())?' cur':''}" x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2"/>`}
  if(!o.line&&plans[i]){s+=`<line class="tick" x1="${cx-step*.4}" x2="${cx+step*.4}" y1="${y(plans[i])}" y2="${y(plans[i])}"/>`}
  s+=`<rect x="${x}" y="0" width="${step}" height="${H}" fill="transparent" data-wk="${m}"/>`});
 if(o.line){let d='',pts=[];sl.forEach((m,i)=>{const v=vals[i];if(v!=null){const cx=pl+i*step+step/2;d+=(d&&pts.length&&pts[pts.length-1]===i-1?'L':'M')+cx+' '+y(v);pts.push(i)}});
  s+=`<path class="ln" d="${d}"/>`;sl.forEach((m,i)=>{const v=vals[i];if(v!=null)s+=`<circle class="dot" cx="${pl+i*step+step/2}" cy="${y(v)}" r="4"/>`})}
 return s+'</svg>'}

function parseFit(buf){
 const dv=new DataView(buf),hs=dv.getUint8(0),end=Math.min(buf.byteLength-2,hs+dv.getUint32(4,true));
 let p=hs;const defs={},out=[];
 while(p<end){
  const h=dv.getUint8(p++);

   const z=await JSZip.loadAsync(await f.arrayBuffer());for(const n of Object.keys(z.files)){if(/\.fit$/i.test(n)&&!z.files[n].dir)bufs.push([n,await z.files[n].async('arraybuffer')])}}
  else if(/\.fit$/i.test(f.name))bufs.push([f.name,await f.arrayBuffer()])}}catch(e){res.textContent='Could not read one of the files.';return}

 for(const [n,b] of bufs){let ss;try{ss=parseFit(b)}catch(e){bad++;continue}
  for(const o of ss){if(o[5]!==1&&o[2]!=null&&o[8]>0){const t=crossType(o);if(t){(await addCross(o,t))?added2++:dup++}else other++;continue}

   const rec={date,km:Math.round(km*100)/100,climb:o[22]!=null&&o[22]<65535?o[22]:0,secs:Math.round(secs),hr:o[16]&&o[16]<255?o[16]:0,route:'',notes:'',src:'garmin'};
